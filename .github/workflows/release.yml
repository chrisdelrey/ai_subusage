name: release

# Push a tag like v2.1.0 (matching subusage/__init__.py) to publish a GitHub Release.
# The widget's updater installs the latest release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Tag must match __version__
        run: |
          v=$(python -c "import subusage; print(subusage.__version__)")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} != v$v"; exit 1; }
      - name: Tests
        run: python -m unittest discover -s tests -t .
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes --title "SubUsage ${GITHUB_REF_NAME}"
